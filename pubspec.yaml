name: docloyvetapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0
  firebase_storage: ^12.0.0
  image_picker: ^1.0.4
  google_generative_ai: ^0.4.3
  intl: ^0.18.1
  http: ^1.1.0
  url_launcher: ^6.2.1
  webview_flutter: ^4.4.2
  mailer: ^6.1.0
  local_auth: ^2.3.0
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  uuid: ^4.2.1
  flutter_slidable: ^3.0.1
  fl_chart: ^0.70.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/DVC.png"
  # Background color na katulad ng sa logo mo
  adaptive_icon_background: "#B8860B"
  adaptive_icon_foreground: "assets/icon/DVC.png"
